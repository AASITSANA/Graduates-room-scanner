name: Find hiring platforms

on:
  workflow_dispatch:
    inputs:
      redo:
        description: "Check every company again (yes/no)"
        required: false
        default: "no"
      only:
        description: "Only this company (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover
        run: |
          ARGS=""
          [ "${{ github.event.inputs.redo }}" = "yes" ] && ARGS="$ARGS --redo"
          [ -n "${{ github.event.inputs.only }}" ] && ARGS="$ARGS --only \"${{ github.event.inputs.only }}\""
          eval python discover.py $ARGS
      - name: Save
        run: |
          git config user.name "graduates-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add companies.csv data/
          git diff --cached --quiet || git commit -m "Platform discovery $(date -u +%F)"
          git push
