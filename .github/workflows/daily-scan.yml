name: Daily graduate job scan

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Test one company (leave empty to scan all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Self-test
        run: python -m pytest -q tests

      - name: Scan
        env:
          USE_BROWSER: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python run.py --only "${{ github.event.inputs.only }}"
          else
            python run.py
          fi

      - name: Publish results
        run: |
          git config user.name "graduates-room-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Job scan $(date -u +%F)"
          git push
